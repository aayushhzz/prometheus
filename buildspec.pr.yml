version: 0.2

env:
  shell: bash
  variables:
    HEXAGON_CI_BINARY_S3: s3://hexagon-ci-demo-029136913161-usw2/bin/35e9b3e/ci-impact-linux-amd64

phases:
  install:
    runtime-versions:
      golang: 1.24
    commands:
      - go version
  build:
    commands:
      - |
        set -euo pipefail
        HEAD_SHA=$(git rev-parse HEAD)
        echo "PR trigger: ${CODEBUILD_WEBHOOK_TRIGGER:-unavailable}"
        echo "Prometheus head: $HEAD_SHA"
        echo "CodeBuild source: ${CODEBUILD_RESOLVED_SOURCE_VERSION:-unavailable}"
        test "$HEAD_SHA" = "$CODEBUILD_RESOLVED_SOURCE_VERSION"
        case "${CODEBUILD_WEBHOOK_TRIGGER:-}" in
          pr/*) ;;
          *) echo 'This project requires a pull-request webhook event.' >&2; exit 2 ;;
        esac
        BASE_REF=${CODEBUILD_WEBHOOK_BASE_REF:?pull request base ref is missing}
        case "$BASE_REF" in
          refs/heads/*) ;;
          *) echo "Invalid pull request base ref: $BASE_REF" >&2; exit 2 ;;
        esac
        git fetch --no-tags origin "$BASE_REF"
        BASE_SHA=$(git merge-base "$HEAD_SHA" FETCH_HEAD)
        echo "Prometheus PR base ref: $BASE_REF"
        echo "Prometheus merge base: $BASE_SHA"
        git worktree add --detach /tmp/hexagon-prometheus-pr-base "$BASE_SHA"
        git diff --no-ext-diff --unified=0 "$BASE_SHA" "$HEAD_SHA" > /tmp/hexagon-pr-change.diff
        aws s3 cp "$HEXAGON_CI_BINARY_S3" /tmp/hexagon-ci-impact
        chmod 700 /tmp/hexagon-ci-impact
        set +e
        /tmp/hexagon-ci-impact --base-repository /tmp/hexagon-prometheus-pr-base --repository "$CODEBUILD_SRC_DIR" --diff /tmp/hexagon-pr-change.diff
        CANDIDATE_STATUS=$?
        echo "Diagnostic candidate status: $CANDIDATE_STATUS"
        go test -count=1 ./...
        FULL_STATUS=$?
        set -e
        echo "Authoritative full suite status: $FULL_STATUS"
        test "$FULL_STATUS" -eq 0
        test "$CANDIDATE_STATUS" -eq 0
